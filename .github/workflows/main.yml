name: Test OpenSky Access

on:
  workflow_dispatch:

jobs:
  test-opensky:
    runs-on: ubuntu-latest

    steps:
      - name: Test OpenSky
        run: |
          echo "Testing OpenSky anonymously"

          curl -L \
            "https://opensky-network.org/api/states/all" \
            -o response.json

          echo "Response size:"
          wc -c response.json

          echo "First 500 characters:"
          head -c 500 response.json
